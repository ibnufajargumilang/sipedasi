<head>

    <meta charset="UTF-8">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@500;700&display=swap"
        rel="stylesheet">

    <!-- Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        heading: ['Outfit', 'sans-serif'],
                    },
                    colors: {
                        primary: '#3b82f6',
                        secondary: '#6366f1',
                        dark: '#0f172a',
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.3s ease-out forwards',
                        'slide-up': 'slideUp 0.3s ease-out forwards',
                        'pop': 'pop 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275)',
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0' },
                            '100%': { opacity: '1' },
                        },
                        slideUp: {
                            '0%': { transform: 'translateY(20px)', opacity: '0' },
                            '100%': { transform: 'translateY(0)', opacity: '1' },
                        },
                        pop: {
                            '0%': { transform: 'scale(0.9)' },
                            '100%': { transform: 'scale(1)' },
                        }
                    }
                }
            }
        }
    </script>

    <style>
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }

        .dark ::-webkit-scrollbar-thumb {
            background: #334155;
        }

        .glass {
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.8);
        }

        .dark .glass {
            border: 1px solid rgba(255, 255, 255, 0.05);
            background: rgba(15, 23, 42, 0.8);
        }

        .bg-mesh {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            background: radial-gradient(circle at 0% 0%, rgba(244, 63, 94, 0.15), transparent 40%),
                radial-gradient(circle at 100% 0%, rgba(168, 85, 247, 0.15), transparent 40%),
                radial-gradient(circle at 100% 100%, rgba(59, 130, 246, 0.15), transparent 40%);
        }

        .dark .bg-mesh {
            background: radial-gradient(circle at 0% 0%, rgba(244, 63, 94, 0.1), transparent 50%),
                radial-gradient(circle at 100% 0%, rgba(168, 85, 247, 0.1), transparent 50%);
        }

        /* Checkbox Custom */
        .custom-checkbox input:checked+div {
            background-color: #10b981;
            border-color: #10b981;
        }

        .custom-checkbox input:checked+div svg {
            display: block;
        }

        /* Strikethrough animation */
        .task-text {
            position: relative;
            transition: color 0.3s ease;
        }

        .task-text::after {
            content: '';
            position: absolute;
            left: 0;
            top: 50%;
            width: 0;
            height: 2px;
            background: #94a3b8;
            transition: width 0.3s ease;
        }

        .task-completed .task-text {
            color: #94a3b8;
        }

        .task-completed .task-text::after {
            width: 100%;
        }

        /* Priority Star */
        .star-active {
            color: #fbbf24;
            /* Amber 400 */
            fill: #fbbf24;
        }

        .star-inactive {
            color: #cbd5e1;
            /* Slate 300 */
        }

        .dark .star-inactive {
            color: #475569;
            /* Slate 600 */
        }
    </style>
</head>

    <script>
        // --- Theme Logic ---
        const themeToggle = document.getElementById('themeToggle');
        const themeIcon = document.getElementById('themeIcon');
        const html = document.documentElement;

        function setTheme(isDark) {
            if (isDark) {
                html.classList.add('dark');
                themeIcon.classList.remove('bi-moon-stars-fill');
                themeIcon.classList.add('bi-sun-fill');
                localStorage.setItem('sipedasi:theme', 'dark');
            } else {
                html.classList.remove('dark');
                themeIcon.classList.remove('bi-sun-fill');
                themeIcon.classList.add('bi-moon-stars-fill');
                localStorage.setItem('sipedasi:theme', 'light');
            }
        }
        const savedTheme = localStorage.getItem('sipedasi:theme');
        const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        setTheme(savedTheme === 'dark' || (!savedTheme && systemDark));
        themeToggle.addEventListener('click', () => setTheme(!html.classList.contains('dark')));

        // --- Date Display ---
        const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
        document.getElementById('currentDate').textContent = new Date().toLocaleDateString('id-ID', options);

        // --- Todo App Logic ---
        const todoInput = document.getElementById('todoInput');
        const categoryInput = document.getElementById('todoCategory');
        const dateInput = document.getElementById('todoDate');
        const priorityBtn = document.getElementById('priorityBtn');
        const priorityIcon = document.getElementById('priorityIcon');
        const addBtn = document.getElementById('addBtn');
        const todoList = document.getElementById('todoList');
        const emptyState = document.getElementById('emptyState');
        const totalCountEl = document.getElementById('totalCount');
        const doneCountEl = document.getElementById('doneCount');
        const priorityCountEl = document.getElementById('priorityCount');
        const clearCompletedBtn = document.getElementById('clearCompletedBtn');

        // Filters
        const statusRadios = document.getElementsByName('statusFilter');
        const categoryFilter = document.getElementById('categoryFilter');

        let isPriorityInput = false;
        let todos = JSON.parse(localStorage.getItem('todos')) || [];

        // Priority Button Logic
        priorityBtn.addEventListener('click', () => {
            isPriorityInput = !isPriorityInput;
            if (isPriorityInput) {
                priorityIcon.classList.replace('text-slate-300', 'text-amber-400');
                priorityIcon.classList.replace('dark:text-slate-600', 'text-amber-400');
            } else {
                priorityIcon.classList.replace('text-amber-400', 'text-slate-300');
                priorityIcon.classList.add('dark:text-slate-600');
            }
        });

        function saveTodos() {
            localStorage.setItem('todos', JSON.stringify(todos));
            updateStats();
            renderTodos();
        }

        function updateStats() {
            const total = todos.length;
            const done = todos.filter(t => t.completed).length;
            const priority = todos.filter(t => t.isPriority && !t.completed).length;

            totalCountEl.textContent = total;
            doneCountEl.textContent = done;
            priorityCountEl.textContent = priority;
        }

        function addTodo() {
            const text = todoInput.value.trim();
            if (!text) {
                showToast('Silahkan isi nama tugas.', 'error');
                return;
            }

            const newTodo = {
                id: Date.now(),
                text: text,
                completed: false,
                category: categoryInput.value,
                deadline: dateInput.value, // YYYY-MM-DD
                isPriority: isPriorityInput,
                createdAt: new Date().toISOString()
            };

            todos.push(newTodo);
            saveTodos();

            // Reset Inputs
            todoInput.value = '';
            dateInput.value = '';
            isPriorityInput = false;
            priorityIcon.classList.replace('text-amber-400', 'text-slate-300');
            priorityIcon.classList.add('dark:text-slate-600');

            showToast('Tugas berhasil ditambahkan!');
        }

        function deleteTodo(id) {
            todos = todos.filter(t => t.id !== id);
            saveTodos();
            showToast('Tugas dihapus.', 'error');
        }

        function toggleTodo(id) {
            todos = todos.map(t => {
                if (t.id === id) return { ...t, completed: !t.completed };
                return t;
            });
            saveTodos();
        }

        function togglePriority(id) {
            todos = todos.map(t => {
                if (t.id === id) return { ...t, isPriority: !t.isPriority };
                return t;
            });
            saveTodos();
        }

        function editTodo(id) {
            const todo = todos.find(t => t.id === id);
            if (!todo) return;
            const newText = prompt("Edit Nama Tugas:", todo.text);
            if (newText !== null && newText.trim() !== "") {
                todos = todos.map(t => {
                    if (t.id === id) return { ...t, text: newText.trim() };
                    return t;
                });
                saveTodos();
            }
        }

        function clearCompleted() {
            const initialLength = todos.length;
            todos = todos.filter(t => !t.completed);
            if (todos.length < initialLength) {
                saveTodos();
                showToast('Tugas selesai dibersihkan.');
            } else {
                showToast('Tidak ada tugas selesai.', 'error');
            }
        }

        function getCategoryColor(cat) {
            switch (cat) {
                case 'Rumah': return 'bg-emerald-100 text-emerald-700 dark:bg-emerald-900/30 dark:text-emerald-400 border-emerald-200 dark:border-emerald-800';
                case 'Kantor': return 'bg-blue-100 text-blue-700 dark:bg-blue-900/30 dark:text-blue-400 border-blue-200 dark:border-blue-800';
                case 'Sekolah': return 'bg-violet-100 text-violet-700 dark:bg-violet-900/30 dark:text-violet-400 border-violet-200 dark:border-violet-800';
                case 'Keuangan': return 'bg-amber-100 text-amber-700 dark:bg-amber-900/30 dark:text-amber-400 border-amber-200 dark:border-amber-800';
                default: return 'bg-slate-100 text-slate-700 dark:bg-slate-800 dark:text-slate-400 border-slate-200 dark:border-slate-700';
            }
        }

        function renderTodos() {
            const statusFilter = document.querySelector('input[name="statusFilter"]:checked').value;
            const catFilter = categoryFilter.value;

            // Sorting: Priority first, then Deadline (nearest first), then CreatedAt
            let sortedTodos = [...todos].sort((a, b) => {
                if (a.completed !== b.completed) return a.completed ? 1 : -1; // Active first
                if (a.isPriority !== b.isPriority) return b.isPriority ? 1 : -1; // Priority first
                if (a.deadline && b.deadline) return new Date(a.deadline) - new Date(b.deadline); // Nearest deadline
                if (a.deadline && !b.deadline) return -1;
                if (!a.deadline && b.deadline) return 1;
                return new Date(b.createdAt) - new Date(a.createdAt); // Newest created
            });

            // Filtering
            let filteredTodos = sortedTodos.filter(t => {
                const matchStatus = statusFilter === 'all' ? true : (statusFilter === 'active' ? !t.completed : t.completed);
                const matchCat = catFilter === 'all' ? true : t.category === catFilter;
                return matchStatus && matchCat;
            });

            todoList.innerHTML = '';

            if (filteredTodos.length === 0) {
                emptyState.classList.remove('hidden');
                todoList.appendChild(emptyState);
            } else {
                emptyState.classList.add('hidden');

                filteredTodos.forEach(todo => {
                    const badgeClass = getCategoryColor(todo.category);

                    // Deadline Logic
                    let deadlineHtml = '';
                    if (todo.deadline) {
                        const today = new Date().toISOString().split('T')[0];
                        const isOverdue = todo.deadline < today && !todo.completed;
                        const dateColor = isOverdue ? 'text-rose-500 font-bold' : 'text-slate-400 dark:text-slate-500';
                        const icon = isOverdue ? 'bi-exclamation-circle-fill' : 'bi-calendar';

                        // Format date to ID
                        const dateObj = new Date(todo.deadline);
                        const formattedDate = dateObj.toLocaleDateString('id-ID', { day: 'numeric', month: 'short' });

                        deadlineHtml = `<span class="text-[10px] flex items-center gap-1 ${dateColor}"><i class="bi ${icon}"></i> ${formattedDate}</span>`;
                    }

                    const el = document.createElement('div');
                    // Style Priority border
                    const borderClass = todo.isPriority && !todo.completed ? 'border-l-[6px] border-l-amber-400 border-t border-r border-b border-slate-100 dark:border-slate-700/50' : 'border border-slate-100 dark:border-slate-700/50';

                    el.className = `group flex items-center gap-3 p-3 mb-2 rounded-xl bg-slate-50 dark:bg-slate-800/50 hover:bg-slate-100 dark:hover:bg-slate-800 transition-all animate-pop relative overflow-hidden ${borderClass} ${todo.completed ? 'opacity-75' : ''}`;

                    el.innerHTML = `
                        <label class="custom-checkbox cursor-pointer relative flex items-center flex-shrink-0">
                            <input type="checkbox" class="sr-only" ${todo.completed ? 'checked' : ''} onchange="toggleTodo(${todo.id})">
                            <div class="w-5 h-5 border-2 border-slate-300 dark:border-slate-600 rounded-md flex items-center justify-center transition-colors">
                                <svg class="w-3.5 h-3.5 text-white hidden pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>
                            </div>
                        </label>
                        
                        <div class="flex-1 min-w-0 cursor-pointer" onclick="toggleTodo(${todo.id})">
                            <div class="flex items-center gap-2 mb-0.5">
                                <span class="text-xs px-1.5 py-0.5 rounded border ${badgeClass}">${todo.category}</span>
                                ${deadlineHtml}
                            </div>
                            <p class="text-sm font-medium text-slate-700 dark:text-slate-200 task-text truncate leading-tight">${todo.text}</p>
                        </div>

                        <div class="flex items-center gap-1">
                            <button onclick="togglePriority(${todo.id})" class="p-1.5 rounded-lg transition-colors ${todo.isPriority ? 'text-amber-400 hover:text-slate-400' : 'text-slate-300 dark:text-slate-600 hover:text-amber-400'}" title="${todo.isPriority ? 'Hapus Penting' : 'Tandai Penting'}">
                                <i class="bi ${todo.isPriority ? 'bi-star-fill' : 'bi-star'}"></i>
                            </button>
                            <button onclick="editTodo(${todo.id})" class="p-1.5 text-slate-400 hover:text-blue-600 hover:bg-blue-50 dark:hover:bg-blue-900/30 rounded-lg transition-colors opacity-0 group-hover:opacity-100" title="Edit">
                                <i class="bi bi-pencil"></i>
                            </button>
                            <button onclick="deleteTodo(${todo.id})" class="p-1.5 text-slate-400 hover:text-rose-600 hover:bg-rose-50 dark:hover:bg-rose-900/30 rounded-lg transition-colors opacity-0 group-hover:opacity-100" title="Hapus">
                                <i class="bi bi-trash"></i>
                            </button>
                        </div>
                    `;
                    todoList.appendChild(el);
                });
            }
        }

        function showToast(msg, type = 'success') {
            const toast = document.getElementById("toast");
            const icon = document.getElementById("toastIcon");
            const txt = document.getElementById("toastMsg");

            txt.textContent = msg;

            toast.className = "fixed bottom-5 right-5 px-6 py-4 rounded-xl shadow-xl transition-all duration-300 z-[60] transform flex items-center gap-3 font-medium text-sm glass text-white backdrop-blur-md";

            if (type === 'success') {
                toast.classList.add('bg-emerald-600/90');
                icon.innerHTML = '<i class="bi bi-check-circle-fill text-lg"></i>';
            } else {
                toast.classList.add('bg-rose-600/90');
                icon.innerHTML = '<i class="bi bi-info-circle-fill text-lg"></i>';
            }

            requestAnimationFrame(() => {
                toast.classList.remove('translate-y-10', 'opacity-0');
            });

            setTimeout(() => {
                toast.classList.add('translate-y-10', 'opacity-0');
            }, 3000);
        }

        // --- Event Listeners ---
        addBtn.addEventListener('click', addTodo);

        todoInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') addTodo();
        });

        clearCompletedBtn.addEventListener('click', () => {
            if (confirm('Hapus semua tugas yang sudah selesai?')) {
                clearCompleted();
            }
        });

        statusRadios.forEach(radio => {
            radio.addEventListener('change', renderTodos);
        });

        categoryFilter.addEventListener('change', renderTodos);

        // Initialize
        updateStats();
        renderTodos();

    </script>
</body>

</html>
